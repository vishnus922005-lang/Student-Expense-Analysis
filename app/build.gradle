plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.google.devtools.ksp"
    id 'com.google.gms.google-services'
}

android {
    namespace "com.example.expensereader"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.expensereader"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    // ✅ Navigation (you already use navGraph)
    implementation "androidx.navigation:navigation-fragment-ktx:2.7.7"
    implementation "androidx.navigation:navigation-ui-ktx:2.7.7"

    // ✅ Room (this fixes your "Unresolved reference: room")
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    ksp "androidx.room:room-compiler:2.6.1"

    // ✅ Coroutines (for Flow)
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    implementation "com.itextpdf:itext7-core:7.2.5"

    implementation "com.itextpdf:kernel:7.2.5"
    implementation "com.itextpdf:layout:7.2.5"

    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
    


    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"

    implementation("com.microsoft.onnxruntime:onnxruntime-android:<LATEST_VERSION>")
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.23.0"
    implementation "com.microsoft.onnxruntime:onnxruntime-extensions-android:0.13.0"
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.17.0"
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.22.0"

    implementation "com.google.mlkit:text-recognition:16.0.1"

    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation "com.google.mlkit:text-recognition-devanagari:16.0.1"
    implementation "com.rmtheis:tess-two:9.1.0"
    implementation "com.github.PhilJay:MPAndroidChart:v3.1.0"
    

    
    
  

 



}
